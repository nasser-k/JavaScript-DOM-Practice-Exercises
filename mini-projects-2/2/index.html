<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Table Rows</title>
    <style>
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .search-container {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f5f5f5;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search in table...">
        </div>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Position</th>
                    <th>Location</th>
                    <th>Department</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Sample data -->
            </tbody>
        </table>
    </div>

    <script>
        // Sample data
        const data = [
            { name: 'John Doe', position: 'Software Engineer', location: 'New York', department: 'Engineering' },
            { name: 'Jane Smith', position: 'Product Manager', location: 'San Francisco', department: 'Product' },
            { name: 'Mike Johnson', position: 'UX Designer', location: 'Chicago', department: 'Design' },
            { name: 'Sarah Williams', position: 'Marketing Lead', location: 'Boston', department: 'Marketing' },
            { name: 'Tom Brown', position: 'Developer', location: 'Seattle', department: 'Engineering' }
        ];

        // Get DOM elements
        const searchInput = document.getElementById('search-input');
        const tableBody = document.getElementById('table-body');

        // Function to render table
        function renderTable(items) {
            tableBody.innerHTML = items.map(item => `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.position}</td>
                    <td>${item.location}</td>
                    <td>${item.department}</td>
                </tr>
            `).join('');
        }

        // Function to filter table
        function filterTable() {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredData = data.filter(item => 
                Object.values(item).some(value => 
                    value.toLowerCase().includes(searchTerm)
                )
            );
            renderTable(filteredData);
        }

        // Event listener for search input
        searchInput.addEventListener('input', filterTable);

        // Initial render
        renderTable(data);
    </script>
</body>
</html>
